name: Verify public handoff

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-domain:
    name: Verify reasonengine.de and Atlas v0.4.1
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4

      - name: Verify source truth and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/reason-v0.4.js
          node --check app/backup-v0.3.js
          node --check .github/scripts/verify-atlas-v041.mjs
          grep -Fq 'atlas-app-v0.4.1-2026-07-26' app/index.html
          grep -Fq 'reason-engine-app-version" content="0.4.1' app/index.html
          grep -Fq 'reason-engine-data-schema" content="0.2' app/index.html
          grep -Fq 'noindex,nofollow' app/index.html
          grep -Fq 'confirmation_invalidated' app/app.js
          grep -Fq 'conflict_review_reset' app/app.js
          grep -Fq 'Importierte Prüfstatus wurden nicht übernommen' app/backup-v0.3.js
          grep -Fq 'Importierte Widerspruchshinweise wurden nicht übernommen' app/backup-v0.3.js
          grep -Fq 'reason-engine-atlas-v041' app/sw.js

      - name: Verify public entrance files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 18 --retry-all-errors --retry-delay 10 \
              --connect-timeout 10 --max-time 45 \
              "$1?verify=${GITHUB_SHA}" --output "$2"
          }
          fetch https://reasonengine.de/ artifacts/home.html
          fetch https://reasonengine.de/study.html artifacts/study.html
          fetch https://reasonengine.de/app/ artifacts/atlas-live.html
          fetch https://reasonengine.de/robots.txt artifacts/robots.txt
          fetch https://reasonengine.de/sitemap.xml artifacts/sitemap.xml
          grep -Fq 'public-entrance-v0.7-2026-07-26' artifacts/home.html
          grep -Fq 'href="app/"' artifacts/home.html
          grep -Fq 'study-pilot-v0.1-2026-07-26' artifacts/study.html
          grep -Fq 'noindex,nofollow' artifacts/atlas-live.html
          grep -Fq 'Allow: /' artifacts/robots.txt
          grep -Fq 'https://reasonengine.de/study.html' artifacts/sitemap.xml
          ! grep -Fq 'https://reasonengine.de/app/' artifacts/sitemap.xml
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            grep -Fq 'atlas-app-v0.4.0-2026-07-26' artifacts/atlas-live.html
          else
            grep -Fq 'atlas-app-v0.4.1-2026-07-26' artifacts/atlas-live.html
          fi

      - name: Start branch preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          nohup python3 -m http.server 4173 > /tmp/atlas-v041-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/app/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/atlas-v041-preview.log
          exit 1

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Exercise Atlas truth boundaries
        shell: bash
        env:
          BRANCH_ATLAS: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173/app/' || 'https://reasonengine.de/app/' }}
          LIVE_ATLAS: https://reasonengine.de/app/
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/verify-atlas-v041.mjs

      - name: Publish handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v041-handoff-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
