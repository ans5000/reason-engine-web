name: Verify public handoff

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-domain:
    name: Verify reasonengine.de
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4

      - name: Verify source truth and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/backup-v0.3.js
          grep -Fq 'public-entrance-v0.7-2026-07-26' index.html
          grep -Fq 'href="app/"' index.html
          grep -Fq 'Öffentliche Alpha · lokal' index.html
          grep -Fq 'atlas-app-v0.3.1-2026-07-26' app/index.html
          grep -Fq 'noindex,nofollow' app/index.html
          grep -Fq 'Sicherung importieren' app/index.html
          grep -Fq 'confirmation_invalidated' app/app.js
          grep -Fq 'node.confirmed = false' app/app.js
          grep -Fq 'Importierte Bestätigungsstatus wurden nicht übernommen' app/backup-v0.3.js
          grep -Fq "confirmed: isRoot" app/backup-v0.3.js
          grep -Fq 'reason-engine-atlas-v031' app/sw.js

      - name: Verify live public files and truth markers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          fetch() {
            local url="$1"
            local output="$2"
            local separator="?"
            if [[ "$url" == *\?* ]]; then
              separator="&"
            fi

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 18 \
              --retry-all-errors \
              --retry-delay 10 \
              --connect-timeout 10 \
              --max-time 45 \
              "${url}${separator}verify=${GITHUB_SHA}" \
              --output "$output"
          }

          fetch "https://reasonengine.de/" artifacts/home.html
          fetch "https://reasonengine.de/study.html" artifacts/study.html
          fetch "https://reasonengine.de/robots.txt" artifacts/robots.txt
          fetch "https://reasonengine.de/sitemap.xml" artifacts/sitemap.xml

          grep -Fq 'Entscheidungen mit KI, die später noch erklärbar sind.' artifacts/home.html
          grep -Fq 'Reason Engine Study' artifacts/home.html
          grep -Fq 'Weihnachtsbaumlogistik' artifacts/home.html
          grep -Fq 'Heute möglich. Noch nicht behauptet.' artifacts/home.html

          grep -Fq 'study-pilot-v0.1-2026-07-26' artifacts/study.html
          grep -Fq 'Sieh, ob deine Hausarbeit wirklich trägt.' artifacts/study.html
          grep -Fq 'FOUNDING STUDENT PASS' artifacts/study.html
          grep -Fq 'Einmalig 10 €' artifacts/study.html

          grep -Fq 'Allow: /' artifacts/robots.txt
          grep -Fq 'Sitemap: https://reasonengine.de/sitemap.xml' artifacts/robots.txt
          grep -Fq 'https://reasonengine.de/' artifacts/sitemap.xml
          grep -Fq 'https://reasonengine.de/study.html' artifacts/sitemap.xml
          ! grep -Fq 'https://reasonengine.de/app/' artifacts/sitemap.xml

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            fetch "https://reasonengine.de/app/" artifacts/atlas.html
            grep -Fq 'public-entrance-v0.7-2026-07-26' artifacts/home.html
            grep -Fq 'href="app/"' artifacts/home.html
            grep -Fq 'atlas-app-v0.3.1-2026-07-26' artifacts/atlas.html
            grep -Fq 'ÖFFENTLICHE ALPHA v0.3.1' artifacts/atlas.html
            grep -Fq 'Sicherung importieren' artifacts/atlas.html
            grep -Fq 'Jede spätere Änderung hebt diesen Status wieder auf.' artifacts/atlas.html
          fi

      - name: Start branch preview for Atlas
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          nohup python3 -m http.server 4173 > /tmp/reason-engine-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/app/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/reason-engine-preview.log
          exit 1

      - name: Install browser for handoff and interaction tests
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Capture pages and exercise Atlas
        shell: bash
        env:
          ATLAS_BASE: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173/app/' || 'https://reasonengine.de/app/' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');

          const captures = [
            { url: 'https://reasonengine.de/', path: 'artifacts/home-desktop.png', width: 1440, height: 1000, reveal: true },
            { url: 'https://reasonengine.de/', path: 'artifacts/home-mobile.png', width: 390, height: 844, reveal: true },
            { url: 'https://reasonengine.de/study.html', path: 'artifacts/study-desktop.png', width: 1440, height: 1000, reveal: true },
            { url: 'https://reasonengine.de/study.html', path: 'artifacts/study-mobile.png', width: 390, height: 844, reveal: true },
            { url: process.env.ATLAS_BASE, path: 'artifacts/atlas-desktop.png', width: 1440, height: 1000, reveal: false },
            { url: process.env.ATLAS_BASE, path: 'artifacts/atlas-mobile.png', width: 390, height: 844, reveal: false },
          ];

          async function prepareLongCapture(page, reveal) {
            await page.addStyleTag({ content: 'html, body { scroll-behavior: auto !important; }' });
            if (reveal) {
              const revealItems = await page.locator('.reveal').all();
              for (const item of revealItems) {
                await item.scrollIntoViewIfNeeded();
                await page.waitForTimeout(120);
              }
            }
            await page.evaluate(() => {
              document.documentElement.style.setProperty('scroll-behavior', 'auto', 'important');
              document.body.style.setProperty('scroll-behavior', 'auto', 'important');
              window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
              if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
            });
            await page.waitForFunction(() => window.scrollY === 0);
          }

          async function exerciseAtlas(browser) {
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 }, acceptDownloads: true });
            const page = await context.newPage();
            const atlasOrigin = new URL(process.env.ATLAS_BASE).origin;
            const externalRequests = [];
            const writeRequests = [];

            page.on('request', (request) => {
              const url = new URL(request.url());
              if (url.origin !== atlasOrigin) externalRequests.push(request.url());
              if (!['GET', 'HEAD'].includes(request.method())) writeRequests.push(`${request.method()} ${request.url()}`);
            });

            await page.goto(`${process.env.ATLAS_BASE}?verify=${process.env.GITHUB_SHA}`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('[data-enter]').click();
            await page.locator('[data-new-atlas]').first().click();
            await page.locator('[data-example]').click();
            await page.locator('[data-problem-form]').evaluate((form) => form.requestSubmit());
            await page.locator('[data-screen="workspace"]:not([hidden])').waitFor();

            const nodeCount = await page.locator('[data-nodes] .node').count();
            if (nodeCount < 5) throw new Error(`Atlas created only ${nodeCount} nodes`);

            await page.locator('[data-tab="chat"]').click();
            await page.locator('#chat-input').fill('Die Haustechnik ist verantwortlich.');
            await page.locator('[data-chat-form]').evaluate((form) => form.requestSubmit());
            await page.locator('[data-tab="atlas"]').click();

            let target = page.locator('button.node').filter({ hasText: 'Die Haustechnik ist verantwortlich' }).first();
            await target.click();
            await page.locator('[data-confirm-node]').click();
            target = page.locator('button.node').filter({ hasText: 'Die Haustechnik ist verantwortlich' }).first();
            if (await target.getAttribute('data-confirmed') !== 'true') throw new Error('Atlas entry was not marked as checked.');

            await target.click();
            await page.locator('[data-node-body]').fill('Die Haustechnik und die Gärtnerei sind gemeinsam verantwortlich.');
            await page.locator('button[value="save"]').click();
            target = page.locator('button.node').filter({ hasText: 'Die Haustechnik ist verantwortlich' }).first();
            if (await target.getAttribute('data-confirmed') !== 'false') throw new Error('Edited entry kept its checked status.');

            await page.locator('[data-tab="history"]').click();
            await page.getByText('Bestätigung für „Die Haustechnik ist verantwortlich“ nach einer Änderung aufgehoben.').waitFor();

            await page.locator('[data-screen="workspace"] [data-back-library]').click();
            await page.locator('[data-screen="library"]:not([hidden]) .atlas-card').waitFor();
            const [download] = await Promise.all([
              page.waitForEvent('download'),
              page.locator('[data-screen="library"]:not([hidden]) [data-export-library]').click(),
            ]);
            if (!download.suggestedFilename().endsWith('.json')) throw new Error('Library backup is not JSON');

            const tamperedBackup = {
              kind: 'reason-engine-atlas-backup',
              version: '0.3',
              atlases: [{
                title: 'Manipulierter Import',
                problem: 'Dieser importierte Testfall prüft die Bestätigungsgrenze.',
                nodes: [
                  { id: 'root', title: 'Manipulierter Import', body: 'Ausgangspunkt', kind: 'root', confirmed: true },
                  { id: 'forged', title: 'Gefälschte Bestätigung', body: 'Diese Aussage kam bestätigt aus einer Datei.', kind: 'known', confirmed: true, source: 'Manipulierte JSON-Datei' }
                ],
                messages: [],
                history: []
              }]
            };

            page.once('dialog', (dialog) => dialog.accept());
            await page.locator('[data-import-input]').setInputFiles({
              name: 'manipulierter-import.json',
              mimeType: 'application/json',
              buffer: Buffer.from(JSON.stringify(tamperedBackup)),
            });
            await page.waitForLoadState('networkidle');
            await page.waitForFunction(() => {
              const library = JSON.parse(localStorage.getItem('reason-engine-atlas-library-v02'));
              return library?.atlases?.length === 2;
            });

            const stored = await page.evaluate(() => JSON.parse(localStorage.getItem('reason-engine-atlas-library-v02')));
            const imported = stored.atlases.find((atlas) => atlas.title === 'Manipulierter Import');
            const forged = imported?.nodes.find((node) => node.title === 'Gefälschte Bestätigung');
            if (!forged || forged.confirmed !== false) throw new Error('Imported JSON preserved a forged checked status.');
            if (!imported.history.some((event) => event.type === 'confirmation_invalidated')) throw new Error('Import invalidation was not recorded.');

            if (externalRequests.length) throw new Error(`External Atlas requests detected: ${externalRequests.join(', ')}`);
            if (writeRequests.length) throw new Error(`Atlas network writes detected: ${writeRequests.join(', ')}`);

            await page.screenshot({ path: 'artifacts/atlas-truth-acceptance.png', fullPage: true });
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const capture of captures) {
                const page = await browser.newPage({ viewport: { width: capture.width, height: capture.height }, deviceScaleFactor: 1 });
                const separator = capture.url.includes('?') ? '&' : '?';
                await page.goto(`${capture.url}${separator}verify=${process.env.GITHUB_SHA}`, { waitUntil: 'networkidle', timeout: 60000 });
                await prepareLongCapture(page, capture.reveal);
                if (capture.reveal) {
                  const hidden = await page.locator('.reveal:not(.is-visible)').count();
                  if (hidden !== 0) throw new Error(`${capture.url} still has ${hidden} hidden reveal elements`);
                }
                await page.screenshot({ path: capture.path, fullPage: true, animations: 'disabled' });
                await page.close();
              }
              await exerciseAtlas(browser);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-handoff-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
