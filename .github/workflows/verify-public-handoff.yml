name: Verify public handoff

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-domain:
    name: Verify reasonengine.de
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify live files and truth markers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          fetch() {
            local url="$1"
            local output="$2"
            local separator="?"
            if [[ "$url" == *\?* ]]; then
              separator="&"
            fi

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 18 \
              --retry-all-errors \
              --retry-delay 10 \
              --connect-timeout 10 \
              --max-time 45 \
              "${url}${separator}verify=${GITHUB_SHA}" \
              --output "$output"
          }

          fetch "https://reasonengine.de/" artifacts/home.html
          fetch "https://reasonengine.de/study.html" artifacts/study.html
          fetch "https://reasonengine.de/robots.txt" artifacts/robots.txt
          fetch "https://reasonengine.de/sitemap.xml" artifacts/sitemap.xml

          grep -Fq 'public-entrance-v0.6-2026-07-26' artifacts/home.html
          grep -Fq 'Entscheidungen mit KI, die später noch erklärbar sind.' artifacts/home.html
          grep -Fq 'Reason Engine Study' artifacts/home.html
          grep -Fq 'Weihnachtsbaumlogistik' artifacts/home.html
          grep -Fq 'Heute möglich. Noch nicht behauptet.' artifacts/home.html

          grep -Fq 'study-pilot-v0.1-2026-07-26' artifacts/study.html
          grep -Fq 'Sieh, ob deine Hausarbeit wirklich trägt.' artifacts/study.html
          grep -Fq 'FOUNDING STUDENT PASS' artifacts/study.html
          grep -Fq 'Einmalig 10 €' artifacts/study.html

          grep -Fq 'Allow: /' artifacts/robots.txt
          grep -Fq 'Sitemap: https://reasonengine.de/sitemap.xml' artifacts/robots.txt
          grep -Fq 'https://reasonengine.de/' artifacts/sitemap.xml
          grep -Fq 'https://reasonengine.de/study.html' artifacts/sitemap.xml

      - name: Install browser for pixel handoff
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Capture revealed desktop and mobile pages
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');

          const captures = [
            { url: 'https://reasonengine.de/', path: 'artifacts/home-desktop.png', width: 1440, height: 1000 },
            { url: 'https://reasonengine.de/', path: 'artifacts/home-mobile.png', width: 390, height: 844 },
            { url: 'https://reasonengine.de/study.html', path: 'artifacts/study-desktop.png', width: 1440, height: 1000 },
            { url: 'https://reasonengine.de/study.html', path: 'artifacts/study-mobile.png', width: 390, height: 844 },
          ];

          async function exerciseRevealElements(page) {
            const revealItems = await page.locator('.reveal').all();

            for (const item of revealItems) {
              await item.scrollIntoViewIfNeeded();
              await page.waitForTimeout(140);
            }

            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(400);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            try {
              for (const capture of captures) {
                const page = await browser.newPage({
                  viewport: { width: capture.width, height: capture.height },
                  deviceScaleFactor: 1,
                });

                const separator = capture.url.includes('?') ? '&' : '?';
                await page.goto(`${capture.url}${separator}verify=${process.env.GITHUB_SHA}`, {
                  waitUntil: 'networkidle',
                  timeout: 60000,
                });

                await exerciseRevealElements(page);

                const hiddenRevealItems = await page.locator('.reveal:not(.is-visible)').count();
                if (hiddenRevealItems !== 0) {
                  throw new Error(`${capture.url} still has ${hiddenRevealItems} hidden reveal elements`);
                }

                await page.screenshot({ path: capture.path, fullPage: true });
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })();
          NODE

      - name: Publish handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-handoff-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
