name: Live public handoff

on:
  pull_request:
    paths:
      - ".github/workflows/live-handoff.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-entrance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify reasonengine.de production handoff
        shell: bash
        run: |
          set -euo pipefail

          base="https://reasonengine.de"
          cache_bust="handoff=${GITHUB_SHA}"

          fetch_until_marker() {
            local url="$1"
            local marker="$2"
            local output="$3"

            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 25 \
                "${url}?${cache_bust}&attempt=${attempt}" \
                --output "${output}" \
                && grep --fixed-strings --quiet "${marker}" "${output}"; then
                return 0
              fi
              sleep 10
            done

            echo "Expected marker not found at ${url}: ${marker}" >&2
            return 1
          }

          fetch_until_marker "${base}/" \
            'public-entrance-v0.6-2026-07-26' \
            /tmp/reasonengine-index.html

          fetch_until_marker "${base}/study.html" \
            'study-pilot-v0.1-2026-07-26' \
            /tmp/reasonengine-study.html

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 25 \
            "${base}/robots.txt?${cache_bust}" \
            --output /tmp/reasonengine-robots.txt

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 25 \
            "${base}/sitemap.xml?${cache_bust}" \
            --output /tmp/reasonengine-sitemap.xml

          grep --fixed-strings --quiet 'Allow: /' /tmp/reasonengine-robots.txt
          grep --fixed-strings --quiet 'https://reasonengine.de/' /tmp/reasonengine-sitemap.xml
          grep --fixed-strings --quiet 'https://reasonengine.de/study.html' /tmp/reasonengine-sitemap.xml
          grep --fixed-strings --quiet 'Entscheidungen mit KI, die später noch erklärbar sind.' /tmp/reasonengine-index.html
          grep --fixed-strings --quiet 'Sieh, ob deine Hausarbeit wirklich trägt.' /tmp/reasonengine-study.html
          grep --fixed-strings --quiet 'Founding Student Pass' /tmp/reasonengine-study.html

          {
            echo '## Reason Engine public handoff'
            echo
            echo '- Homepage build marker: PASS'
            echo '- Study build marker: PASS'
            echo '- Hero copy: PASS'
            echo '- Founding Student Pass disclosure: PASS'
            echo '- robots.txt: PASS'
            echo '- sitemap.xml: PASS'
            echo
            echo "Verified commit context: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
