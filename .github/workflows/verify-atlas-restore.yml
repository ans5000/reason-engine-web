name: Verify Atlas backup restore

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/verify-atlas-restore-v081.mjs"
      - ".github/workflows/verify-atlas-restore.yml"
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-atlas-restore:
    name: Export and restore Atlas v0.8.1
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4

      - name: Verify restore source
        shell: bash
        run: |
          set -euo pipefail
          node --check app/truth-gate-v0.8.1.js
          node --check app/viewport-center-v0.8.1.js
          node --check app/backup-v0.3.js
          node --check .github/scripts/verify-atlas-restore-v081.mjs
          grep -Fq 'atlas-app-v0.8.1-2026-07-26' app/index.html
          grep -Fq 'atlas-viewport-hotfix-2026-07-26' app/index.html
          grep -Fq 'atlas-toolbar-hotfix-v0.9.1-2026-07-27' app/index.html
          grep -Fq 'truth-gate-v0.8.1.js' app/index.html
          grep -Fq 'viewport-center-v0.8.1.js' app/index.html
          grep -Fq 'reason-engine-atlas-v091-toolbar-hotfix' app/sw.js
          grep -Fq 'atlas-toolbar-hotfix-v0.9.1.css' app/sw.js

      - name: Start branch preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          nohup python3 -m http.server 4173 > /tmp/reason-engine-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/app/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reason-engine-preview.log
          exit 1

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Exercise complete backup cycle
        shell: bash
        env:
          ATLAS_BASE: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173/app/index.html' || 'https://reasonengine.de/app/index.html' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node .github/scripts/verify-atlas-restore-v081.mjs 2>&1 | tee artifacts/restore-browser.log

      - name: Publish restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-restore-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
