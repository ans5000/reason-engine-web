name: Verify Atlas Desired Paths live

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-atlas-desired-paths-live.yml"
      - "app/index.html"
      - "app/path-growth-v0.9.js"
      - "app/path-growth-v0.9.css"
      - "app/sw.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-desired-paths-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-desired-paths:
    name: Verify reasonengine.de Desired Paths
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4

      - name: Verify source markers and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app/path-growth-v0.9.js
          grep -Fq 'atlas-desired-paths-v0.9-2026-07-27' app/index.html
          grep -Fq 'path-growth-v0.9.js' app/index.html
          grep -Fq 'path-growth-v0.9.css' app/index.html
          grep -Fq 'center_emerged' app/path-growth-v0.9.js
          grep -Fq 'path-growth-v0.9.js' app/sw.js
          grep -Fq 'path-growth-v0.9.css' app/sw.js

      - name: Verify deployed Desired Paths files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          fetch() {
            local url="$1"
            local output="$2"
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 45 \
                "${url}?verify=${GITHUB_SHA}-${attempt}" --output "$output"; then
                return 0
              fi
              sleep 10
            done
            return 1
          }
          fetch "https://reasonengine.de/app/index.html" artifacts/atlas-live.html
          fetch "https://reasonengine.de/app/path-growth-v0.9.js" artifacts/path-growth-live.js
          fetch "https://reasonengine.de/app/path-growth-v0.9.css" artifacts/path-growth-live.css
          fetch "https://reasonengine.de/app/sw.js" artifacts/sw-live.js
          grep -Fq 'atlas-desired-paths-v0.9-2026-07-27' artifacts/atlas-live.html
          grep -Fq 'path-growth-v0.9.js' artifacts/atlas-live.html
          grep -Fq 'path-growth-v0.9.css' artifacts/atlas-live.html
          grep -Fq 'center_emerged' artifacts/path-growth-live.js
          grep -Fq '.next-hex' artifacts/path-growth-live.css
          grep -Fq 'path-growth-v0.9.js' artifacts/sw-live.js
          printf '{"result":"PASS","marker":"atlas-desired-paths-v0.9-2026-07-27","commit":"%s"}\n' "$GITHUB_SHA" > artifacts/desired-paths-live.json

      - name: Publish live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desired-paths-live-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
